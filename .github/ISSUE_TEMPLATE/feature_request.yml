name: Feature request
description: Suggest something the project should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >
        The situation, not the solution. Knowing what you were trying to do often
        surfaces an answer nobody would have proposed from the feature alone.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered?
      description: Including whether something in the CMS already comes close.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and discussions for this idea.
          required: true
